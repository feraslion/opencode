name: Build Android APK

# متى يتم تشغيل هذا الـ Workflow؟
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح بتشغيله يدوياً من واجهة GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود من المستودع
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. تثبيت Java Development Kit (JDK)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. إعداد Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. إعطاء صلاحيات التشغيل لملف Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. بناء ملف APK (نسخة Debug)
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 6. رفع ملف APK كـ Artifact لتتمكن من تحميله
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7 # مدة حفظ الملف على GitHub قبل الحذف التلقائي
